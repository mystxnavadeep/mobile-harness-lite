name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.3)'
        required: true
        type: string
      tag:
        description: 'Git tag to create (e.g., v1.0.3). If empty, uses "v${version}"'
        required: false
        type: string
      release_type:
        description: 'Release type (flavor)'
        required: true
        default: 'online'
        type: choice
        options:
          - online
          - offline
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.14.3'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    outputs:
      flavor: ${{ steps.set_flavor.outputs.flavor }}
      sha256: ${{ steps.sha256.outputs.sha256 }}
      apk_size: ${{ steps.apk.outputs.apk_size }}
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      package: ${{ steps.version.outputs.package }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" || true

      - name: Determine build flavor
        id: set_flavor
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # For tag pushes, default to online (can be overridden via workflow_dispatch if needed)
            echo "flavor=online" >> $GITHUB_OUTPUT
          else
            FLAVOR="${{ github.event.inputs.release_type }}"
            echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          fi

      - name: Detect Gradle project
        id: detect
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle*" -not -path "*/build/*" -not -path "*/.gradle/*" | head -1 | xargs dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "No Gradle project found"
            exit 1
          fi
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          echo "Found Gradle project at: $PROJECT_ROOT"

      - name: Make gradlew executable
        run: chmod +x ${{ steps.detect.outputs.project_root }}/gradlew

      - name: Configure GitHub Secrets for signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ${{ steps.detect.outputs.project_root }}/upload.keystore
            echo "MH_UPLOAD_STORE_FILE=upload.keystore" >> $GITHUB_ENV
            echo "MH_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "MH_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "MH_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "Signing keystore configured."
          else
            echo "Signing secrets not present. Skipping keystore configuration."
          fi

      - name: Build Release APK
        working-directory: ${{ steps.detect.outputs.project_root }}
        run: |
          FLAVOR="${{ steps.set_flavor.outputs.flavor }}"
          GRADLE_TASK="assemble${FLAVOR^}Release"
          echo "Building flavor: $FLAVOR"
          echo "Running: ./gradlew $GRADLE_TASK"
          ./gradlew $GRADLE_TASK --no-daemon --console=plain

      - name: Verify APK exists
        id: apk
        working-directory: ${{ steps.detect.outputs.project_root }}
        run: |
          FLAVOR="${{ steps.set_flavor.outputs.flavor }}"
          APK_PATTERN="**/outputs/apk/${FLAVOR}/release/*.apk"
          APKS=$(find . -path "$APK_PATTERN" -name "*.apk" | grep -v "unsigned" | grep -v "unaligned" || true)
          if [ -z "$APKS" ]; then
            echo "No $FLAVOR release APK found"
            exit 1
          fi
          FIRST_APK=$(echo "$APKS" | head -1)
          SIZE=$(stat -c%s "$FIRST_APK")
          if [ "$SIZE" -eq 0 ]; then
            echo "APK is empty: $FIRST_APK"
            exit 1
          fi
          echo "Found APK: $FIRST_APK ($SIZE bytes)"
          echo "apk_path=$FIRST_APK" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Calculate SHA-256
        id: sha256
        working-directory: ${{ steps.detect.outputs.project_root }}
        run: |
          SHA256=$(sha256sum "${{ steps.apk.outputs.apk_path }}" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA-256: $SHA256"

      - name: Extract version info from APK
        id: version
        working-directory: ${{ steps.detect.outputs.project_root }}
        run: |
          if command -v aapt2 &> /dev/null; then
            AAPT2=aapt2
          elif command -v aapt &> /dev/null; then
            AAPT2=aapt
          else
            echo "aapt/aapt2 not found, skipping version extraction"
            exit 0
          fi
          BADGING=$($AAPT2 dump badging "${{ steps.apk.outputs.apk_path }}" 2>/dev/null | head -20)
          echo "APK badging:"
          echo "$BADGING"
          VERSION_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']*" || echo "unknown")
          VERSION_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']*" || echo "unknown")
          PACKAGE=$(echo "$BADGING" | grep -oP "package: name='\K[^']*" || echo "unknown")
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_flavor.outputs.flavor }}-release-apk
          path: ${{ steps.detect.outputs.project_root }}/${{ steps.apk.outputs.apk_path }}
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: github.event_name == 'push' || github.event.inputs.version != ''
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.flavor }}-release-apk
          path: ./apk

      - name: Determine release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v$VERSION"
            fi
          fi
          FLAVOR="${{ needs.build.outputs.flavor }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT

      - name: Find APK file
        id: find_apk
        run: |
          APK_FILE=$(find ./apk -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK file found in artifacts"
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Rename APK for release
        run: |
          FLAVOR="${{ steps.release_info.outputs.flavor }}"
          VERSION="${{ steps.release_info.outputs.version }}"
          NEW_NAME="Mobile-Harness-Lite-${VERSION}-${FLAVOR}-release.apk"
          cp "${{ steps.find_apk.outputs.apk_file }}" "./$NEW_NAME"
          echo "release_apk=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          FLAVOR="${{ steps.release_info.outputs.flavor }}"
          VERSION="${{ steps.release_info.outputs.version }}"
          TAG="${{ steps.release_info.outputs.tag }}"
          SHA256="${{ needs.build.outputs.sha256 }}"
          APK_SIZE="${{ needs.build.outputs.apk_size }}"
          VERSION_CODE="${{ needs.build.outputs.version_code }}"
          VERSION_NAME="${{ needs.build.outputs.version_name }}"
          PACKAGE="${{ needs.build.outputs.package }}"

          cat > release_notes.md <<EOF
# Mobile-Harness-Lite ${TAG}

**Release Date**: $(date -u +"%Y-%m-%d")

## Download
- **${FLAVOR^} Edition APK**: \`Mobile-Harness-Lite-${VERSION}-${FLAVOR}-release.apk\`

## Build Information
| Property | Value |
|----------|-------|
| Version | ${VERSION_NAME:-${VERSION}} |
| Version Code | ${VERSION_CODE:-${VERSION}} |
| Package ID | ${PACKAGE:-com.jarves.mh} |
| Flavor | ${FLAVOR} |
| Build Type | Release |
| Architecture | arm64-v8a (ARM64) |
| Min SDK | 28 (Android 9+) |
| Target SDK | 28 |
| APK Size | $(numfmt --to=iec-i --suffix=B ${APK_SIZE:-0}) |
| SHA-256 | \`${SHA256:-unknown}\` |

## Installation
1. Download the APK from the assets below
2. Enable "Install unknown apps" for your browser/file manager
3. Open the APK to install
4. Launch Mobile-Harness-Lite and complete onboarding

## Architecture
This is the **${FLAVOR^} Edition** (cloud-first, lightweight):
- **Online Edition**: ~45 MB - Downloads runtime bundles on demand from GitHub Releases
- **Offline Edition**: ~800+ MB - Includes all runtime bundles (Core, Python, Android)

## Cloud-First Build & Deploy
- **Android builds**: Performed remotely via GitHub Actions (no local Android SDK/NDK required)
- **Web deployments**: Via Vercel (preview URLs generated automatically)
- **Local editing**: Full file editing, AI agent, terminal on device
- **No heavy toolchains**: Tablet only needs Node.js, Git, and Claude Code CLI

## Known Limitations
- ARM64 only (no x86/x64 support)
- PRoot is userspace emulation, not a hardened security boundary
- Requires stable internet for runtime downloads and cloud builds
- Samsung Galaxy Tab A9 (3 GB RAM) supported - exempt from battery optimization recommended
- Large Gradle builds may be slow under PRoot

## Changelog
See commit history for detailed changes.

## Verification
\`\`\`bash
# Verify SHA-256
sha256sum Mobile-Harness-Lite-${VERSION}-${FLAVOR}-release.apk
# Expected: ${SHA256:-<check release notes>}
\`\`\`

EOF
          cat release_notes.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Mobile-Harness-Lite ${{ steps.release_info.outputs.tag }}
          body_path: release_notes.md
          files: |
            ${{ steps.find_apk.outputs.apk_file }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release was created
        run: |
          echo "Release created: ${{ steps.release_info.outputs.tag }}"
          echo "APK uploaded: ${{ steps.find_apk.outputs.apk_file }}"